# TestMind Alembic configuration (ASCII only: Windows configparser reads this
# file with the locale encoding, so keep comments plain ASCII).
#
# Usage:
# - Run alembic commands from the backend directory.
# - The database URL is NOT stored here. env.py resolves it from the explicit
#   sqlalchemy.url option, falling back to app.core.config.settings
#   (which honors the DATABASE_URL environment variable).
# - Running migrations against MySQL requires explicitly setting
#   ALEMBIC_ALLOW_MYSQL=1 in the environment.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
